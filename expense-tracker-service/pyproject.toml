# Only tool configuration lives here; dependencies are in requirements.txt.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP046"]  # E501: formatter owns line length; UP046: classic Generic[T] is beginner-friendly

[tool.pytest.ini_options]
testpaths = ["tests"]
